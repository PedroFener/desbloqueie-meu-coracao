# Gera o APK (e o AAB para a Play Store) automaticamente no GitHub.
# Basta enviar o projeto para um repositório: a cada envio, vá em
# Actions → "Gerar APK" → baixe o arquivo em "Artifacts".
name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # para publicar o APK na página de Releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Conferir Android SDK (já vem instalado no servidor do GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Gerar APK de teste (instala direto no celular)
        run: gradle assembleDebug --no-daemon

      - name: Preparar chave de assinatura (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Gerar versão assinada para a Play Store (AAB + APK)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --no-daemon

      - name: Dar nome bonito ao APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DesbloqueieMeuCoracao.apk

      - name: Publicar o APK em Releases (link direto para baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Desbloqueie Meu Coração v1.0.${{ github.run_number }}
          body: |
            Jogo indie romântico em pixel art, criado por Pedro Henrique Dias Fener.
            Baixe o arquivo **DesbloqueieMeuCoracao.apk** abaixo e instale no seu Android.
          files: android/app/build/outputs/apk/debug/DesbloqueieMeuCoracao.apk
          make_latest: true

      - name: Enviar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: DesbloqueieMeuCoracao-APK-teste
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Enviar versão da Play Store
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DesbloqueieMeuCoracao-PlayStore
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
